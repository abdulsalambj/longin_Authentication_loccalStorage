<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Register</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="d-flex justify-content-center align-items-center vh-100 bg-danger-subtle">
  <div class="card p-4" style="width: 22rem;">
    <h2 class="text-center mb-4">Register</h2>
    <form action="/index.html" id="registerForm">
      <div class="mb-3">
        <input type="text" class="form-control" id="registerName" placeholder="Name" required>
      </div>
      <div class="mb-3">
        <input type="email" class="form-control" id="registerEmail" placeholder="Email" required>
      </div>
      <div class="mb-3">
        <input type="password" class="form-control" id="registerPassword" placeholder="Password" required>
      </div>
      <button type="submit" class="btn btn-success w-100">Register</button>
    </form>
    <p class="mt-3 text-center">Already have an account? <a href="index.html">Login</a></p>
  </div>


  <script src="Register.js"></script>
</body>
</html>
