<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="d-flex justify-content-center align-items-center vh-100 bg-success-subtle">
  <div class="card p-4" style="width: 20rem;">
    <h2 class="text-center mb-4">Login</h2>
    <form id="loginForm">
      <div class="mb-3">
        <input type="email" class="form-control" id="loginEmail" placeholder="Email" required>
      </div>
      <div class="mb-3">
        <input type="password" class="form-control" id="loginPassword" placeholder="Password" required>
      </div>
      <button type="submit" class="btn btn-outline-danger w-100">Login</button>
    </form>
    <p class="mt-3 text-center">No account? <a href="register.html">Register</a></p>
  </div>
  
      
      <script src="index.js"></script>
    </body>
    </html>
